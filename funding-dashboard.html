<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<body>

<div class="notice" id="demoNotice" hidden>
  <span>⚠ 구글시트 연동 전 예시 데이터로 표시 중입니다. 코드 상단 CONFIG의 CSV 링크를 채워주세요.</span>
</div>

<main class="wrap">

  <header class="masthead">
    <p class="eyebrow">FOOTBALL CLUB · ISFC</p>
    <h1 id="title">OBYB FESTIVAL</h1>
    <p class="desc" id="desc"></p>
  </header>

  <section class="card amount-card">
    <div class="amount-row">
      <div class="amount-block">
        <span class="label">모금액</span>
        <span class="figure" id="raisedAmount">0</span>
      </div>
      <div class="amount-block target">
        <span class="label">목표금액</span>
        <span class="figure figure-target" id="targetAmount">0</span>
      </div>
    </div>

    <div class="crest" aria-label="달성률 배지">
      <div class="crest-stars" id="crestStars">★★★★★★★</div>
      <svg class="crest-ring" viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="86"></circle>
        <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="86"></circle>
      </svg>
      <div class="crest-center">
        <span class="crest-pct" id="ratePct">0%</span>
        <span class="crest-label">DAL·SEONG·RYUL</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <span class="stat-num" id="participantCount">0</span>
        <span class="stat-label">참여자</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="avgAmount">0</span>
        <span class="stat-label">평균 참여 금액</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="remainAmount">0</span>
        <span class="stat-label">남은 금액</span>
      </div>
    </div>
  </section>

  <section class="card roster-card">
    <h2 class="roster-title">참가자 명단 <span class="roster-sub">SQUAD LIST</span></h2>
    <div class="roster-list" id="rosterList">
      <p class="empty-state">불러오는 중…</p>
    </div>
  </section>

  <button class="cta" id="fundBtn">펀딩하기</button>

  <p class="updated" id="updatedAt"></p>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
    <p class="stub-eyebrow">MATCH TICKET · 입금 안내</p>
    <h3 id="modalTitle">펀딩 참여 안내</h3>
    <div class="stub-row">
      <span class="stub-label">은행</span>
      <span class="stub-value" id="bankName">-</span>
    </div>
    <div class="stub-row">
      <span class="stub-label">계좌번호</span>
      <span class="stub-value mono" id="bankAccount">-</span>
      <button class="copy-btn" id="copyBtn">복사</button>
    </div>
    <div class="stub-row">
      <span class="stub-label">예금주</span>
      <span class="stub-value" id="bankHolder">-</span>
    </div>
    <a class="kakaopay-link" id="kakaopayLink" href="#" rel="noopener" hidden>카카오페이로 송금하기 →</a>
    <p class="modal-footnote">입금해주신 내역은 참가자 명단에 순차 반영됩니다.</p>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — 여기 두 줄만 채우면 대시보드가 자동으로 살아납니다.
   구글시트 열기 → 파일 → 공유 → 웹에 게시 → 해당 탭 선택 →
   형식은 반드시 "쉼표로 구분된 값(.csv)" 선택 → 링크 복사
   ============================================================ */
const CONFIG = {
  SETTINGS_CSV_URL: "",     // "설정" 탭 웹에 게시 CSV 링크
  PARTICIPANTS_CSV_URL: "", // "참여자" 탭 웹에 게시 CSV 링크
  REFRESH_MS: 30000
};

/* 예시(데모) 데이터 — 실제 시트 연동 전까지 화면 구성 확인용 */
const DEMO_SETTINGS = {
  "제목": "ISFC 20주년 후원 펀딩",
  "목표금액": "1000000",
  "설명": "10월 31일 토요일 — 1부 풋살대회 & 2부 뒤풀이, 창단 20주년을 함께 축하해주세요.",
  "은행명": "카카오뱅크",
  "계좌번호": "3333-05-4093882",
  "예금주": "유형선",
  "카카오페이링크": ""
};
const DEMO_PARTICIPANTS = [
  { "이름": "김OO", "금액": "50000" },
  { "이름": "이OO", "금액": "30000" },
  { "이름": "박OO", "금액": "100000" },
  { "이름": "최OO", "금액": "20000" }
];

/* ---------------- CSV 파서 ---------------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = ""; rows.push(row); row = [];
      } else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ""));
}

function csvToObjects(text) {
  const rows = parseCSV(text);
  if (rows.length < 1) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (r[idx] ?? "").trim());
    return obj;
  });
}

function toNumber(str) {
  const n = parseInt(String(str).replace(/[^0-9-]/g, ""), 10);
  return isNaN(n) ? 0 : n;
}

/* ---------------- 데이터 로드 ---------------- */
async function fetchCSV(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("fetch failed");
  return await res.text();
}

async function loadData() {
  let settings, participants, isDemo = false;

  if (CONFIG.SETTINGS_CSV_URL && CONFIG.PARTICIPANTS_CSV_URL) {
    try {
      const [settingsText, participantsText] = await Promise.all([
        fetchCSV(CONFIG.SETTINGS_CSV_URL),
        fetchCSV(CONFIG.PARTICIPANTS_CSV_URL)
      ]);
      const settingsRows = csvToObjects(settingsText);
      settings = {};
      settingsRows.forEach(r => {
        const key = r["key"] ?? r["항목"] ?? Object.values(r)[0];
        const val = r["value"] ?? r["값"] ?? Object.values(r)[1];
        if (key) settings[key.trim()] = (val ?? "").trim();
      });
      participants = csvToObjects(participantsText);
    } catch (e) {
      console.error("CSV 로드 실패, 예시 데이터로 대체합니다.", e);
      settings = DEMO_SETTINGS;
      participants = DEMO_PARTICIPANTS;
      isDemo = true;
    }
  } else {
    settings = DEMO_SETTINGS;
    participants = DEMO_PARTICIPANTS;
    isDemo = true;
  }

  render(settings, participants, isDemo);
}

/* ---------------- 렌더 ---------------- */
function animateNumber(el, to) {
  const from = toNumber(el.textContent.replace(/,/g, ""));
  const duration = 700;
  const start = performance.now();
  function step(now) {
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = Math.round(from + (to - from) * eased);
    el.textContent = val.toLocaleString("ko-KR");
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const RING_CIRCUMFERENCE = 2 * Math.PI * 86;

function render(settings, participants, isDemo) {
  document.getElementById("demoNotice").hidden = !isDemo;

  document.getElementById("title").textContent = settings["제목"] || "OBYB FESTIVAL";
  document.getElementById("desc").textContent = settings["설명"] || "";

  const target = toNumber(settings["목표금액"]);
  const raised = participants.reduce((sum, p) => sum + toNumber(p["금액"]), 0);
  const count = participants.length;
  const rate = target > 0 ? Math.min(100, Math.round((raised / target) * 1000) / 10) : 0;
  const avg = count > 0 ? Math.round(raised / count) : 0;
  const remain = Math.max(0, target - raised);

  animateNumber(document.getElementById("raisedAmount"), raised);
  animateNumber(document.getElementById("targetAmount"), target);
  animateNumber(document.getElementById("avgAmount"), avg);
  animateNumber(document.getElementById("remainAmount"), remain);
  document.getElementById("participantCount").textContent = count.toLocaleString("ko-KR");

  const ring = document.getElementById("ringFill");
  ring.style.strokeDasharray = String(RING_CIRCUMFERENCE);
  ring.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - rate / 100));
  document.getElementById("ratePct").textContent = rate + "%";

  const litStars = Math.max(1, Math.round((rate / 100) * 7));
  document.getElementById("crestStars").textContent = "★".repeat(litStars) + "☆".repeat(7 - litStars);

  const list = document.getElementById("rosterList");
  if (count === 0) {
    list.innerHTML = '<p class="empty-state">아직 참가자가 없어요. 첫 참가자가 되어보세요.</p>';
  } else {
    list.innerHTML = participants
      .map((p, i) => {
        const name = p["이름"] || "익명";
        const amt = toNumber(p["금액"]).toLocaleString("ko-KR");
        const num = String(i + 1).padStart(2, "0");
        return `<div class="roster-row"><span class="roster-num">${num}</span><span class="roster-name">${escapeHTML(name)}</span><span class="dots"></span><span class="roster-amt">${amt}원</span></div>`;
      })
      .join("");
  }

  document.getElementById("bankName").textContent = settings["은행명"] || "-";
  document.getElementById("bankAccount").textContent = settings["계좌번호"] || "-";
  document.getElementById("bankHolder").textContent = settings["예금주"] || "-";
  const kakaopay = settings["카카오페이링크"];
  const kakaopayEl = document.getElementById("kakaopayLink");
  if (kakaopay) { kakaopayEl.href = kakaopay; kakaopayEl.hidden = false; } else { kakaopayEl.hidden = true; }

  document.getElementById("updatedAt").textContent =
    "마지막 업데이트 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---------------- 모달 ---------------- */
const backdrop = document.getElementById("modalBackdrop");
function openModal() { backdrop.classList.add("is-open"); }
function closeModal() { backdrop.classList.remove("is-open"); }
document.getElementById("fundBtn").addEventListener("click", openModal);
document.getElementById("modalClose").addEventListener("click", closeModal);
backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = document.getElementById("bankAccount").textContent;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "복사됨";
    setTimeout(() => { btn.textContent = original; }, 1500);
  } catch (e) { /* clipboard unavailable */ }
});

/* ---------------- 시작 ---------------- */
loadData();
setInterval(loadData, CONFIG.REFRESH_MS);
</script>

  display: flex; align-items: center; gap: 10px;
